name: Prelaunch Preflight

on:
  push:
    branches: [codex/prelaunch-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prelaunch-preflight
  cancel-in-progress: false

jobs:
  verification:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      actions: write

  inspect-server:
    needs: verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only server preflight with pinned host key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SSH_HOST" = '76.13.224.251'
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          key="$RUNNER_TEMP/carimbai-preflight-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          ssh -T -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
            -o UserKnownHostsFile=deploy/production_known_hosts \
            "$SSH_USER@$SSH_HOST" 'bash -se' < deploy/preflight_server.sh
