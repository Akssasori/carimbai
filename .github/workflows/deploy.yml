name: Deploy Carimbai

on:
  push:
    branches:
      - main

jobs:
  verification:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      actions: write

  build-and-deploy:
    needs: verification
    runs-on: ubuntu-latest

    steps:
      - name: Download tested application
        uses: actions/download-artifact@v4
        with:
          name: verified-application
          path: target

      - name: Rename JAR to match Service
        run: mv target/carimbai-*.jar target/app.jar

      - name: Copy JAR to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "target/app.jar"
          target: "/opt/app"
          strip_components: 1

      - name: Restart Service via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Move o app.jar para o nome final esperado pelo .service
            mv /opt/app/app.jar /opt/app/carimbai-0.0.1-SNAPSHOT.jar
            # Reinicia o serviço
            sudo systemctl restart carimbai.service
