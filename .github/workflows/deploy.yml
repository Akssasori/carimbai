name: Deploy Carimbai

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: carimbai-production
  cancel-in-progress: false

jobs:
  verification:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
      actions: write

  build-and-deploy:
    needs: verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download tested application
        uses: actions/download-artifact@v4
        with:
          name: verified-application
          path: target

      - name: Rename JAR to match Service
        run: mv target/carimbai-*.jar target/app.jar

      - name: Preflight, backup, isolated restore and verified release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SSH_HOST" = '76.13.224.251'
          test -n "$SSH_USER"
          test -n "$SSH_PRIVATE_KEY"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          key="$RUNNER_TEMP/carimbai-release-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          options=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o ConnectTimeout=30
            -o UserKnownHostsFile=deploy/production_known_hosts)
          remote="$SSH_USER@$SSH_HOST"
          ssh -T "${options[@]}" "$remote" 'bash -se' < deploy/preflight_server.sh
          destination="/opt/app/incoming/$GITHUB_SHA"
          ssh -T "${options[@]}" "$remote" "umask 077; mkdir -p '$destination'"
          scp "${options[@]}" target/app.jar deploy/release.py "$remote:$destination/"
          digest="$(sha256sum target/app.jar | cut -d ' ' -f 1)"
          ssh -T "${options[@]}" "$remote" "python3 '$destination/release.py' '$GITHUB_SHA' '$digest'"
